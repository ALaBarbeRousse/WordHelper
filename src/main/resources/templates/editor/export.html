<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Словесный помогатор</title>
        <link rel="stylesheet" type="text/css" href="/css/common.css">
        <link rel="stylesheet" type="text/css" href="/css/export.css">
    <!--    <link rel="stylesheet" type="text/css" href="/css/language.css">-->
        <link rel="icon" type="image/png" href="/img/globe.png" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
        <script src="/js/sound.js"></script>
        <script src="/js/export.js"></script>
        <script src="/js/import.js"></script>
    <!--    <script src="/js/language.js"></script>-->
    <!--    <script src="/js/sound.js"></script>-->
    </head>
    <body>
        <div class="user_pane">
            <div class="dropdown">
                <button id="dropdown_btn" th:text="${student_name}"></button>
                <div class="dropdown-content">
                    <!--            <a href="#">Мой профиль</a>-->
                    <a href="/logout">Выход</a>
                </div>
            </div>
            <!--            <div>(Мой язык: <span th:text="${my_language}"></span>)</div>-->
        </div>
        <h1 class="caption">Словесный помогатор</h1>
        <div class="description_env">
            <div><button id="home_btn" onclick="location.href='/main'"></button></div>
            <div class="description">Экспорт-импорт словарей</div>
            <div></div>
        </div>
        <fieldset>
            <legend>Экспорт</legend>
            <div class="caption_wrapper lang_select">
                <span>Язык</span>
                <div></div>
                <span>Язык</span>
            </div>
            <div class="lang_select lang_row">
                <input id="left" type="text" class="export_input" list="left_list"/>
                <datalist id="left_list"></datalist>
                <div></div>
                <input id="right" type="text" class="export_input" list="right_list"/>
                <datalist id="right_list"></datalist>
            </div>
            <div class="add_pair_wrapper">
                <div></div><div class="add_button button_disabled" title="Добавить словарь в экспорт"></div><div></div>
            </div>
            <div class="message_wrapper"><span id="export_message"></span></div>
            <div class="button_wrapper">
                <button class="ok" id="export_btn" disabled>Экспорт</button>
            </div>
        </fieldset>
        <fieldset>
            <legend>Импорт</legend>
            <div class="import_file_wrapper">
                <div class="import_input_wrapper">
                    <input type="file" accept="application/json" id="dict_input"/>
                    <span id="import_message"></span>
                </div>
            </div>
            <div class="button_wrapper">
                <button class="ok" id="import_btn" disabled="">Импорт</button>
            </div>
        </fieldset>
    </body>
</html>
