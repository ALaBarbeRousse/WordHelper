<!DOCTYPE html>
<html lang="ru" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Словесный помогатор</title>
    <!-- Шрифты редизайна -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prata&family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/common.css">
    <link rel="stylesheet" type="text/css" href="/css/main.css">
    <link rel="icon" type="image/png" href="/img/globe.png"/>
</head>
<body>
    <div class="user_pane">
        <div class="dropdown">
            <button id="dropdown_btn" th:text="${student_name}"></button>
            <div class="dropdown-content">
                <a href="/logout">Выход</a>
            </div>
        </div>
    </div>
    <h1 class="caption">Словесный помогатор</h1>
    <div class="description">Приложение, призванное помочь в изучении иностранных языков</div>

    <fieldset class="link_panel" sec:authorize="hasAuthority('Student')">
        <legend>Изучение</legend>
        <div>
            <a href="training">Тренировка</a>
        </div>
        <div>
            <a href="collection">Подборка</a>
        </div>
    </fieldset>

    <fieldset class="link_panel" sec:authorize="hasAuthority('Editor')">
        <legend>Словари</legend>
        <div>
            <a href="word">Слово</a>
        </div>
        <div>
            <a href="sounding">Озвучка</a>
        </div>
        <div>
            <a href="export">Экспорт-Импорт</a>
        </div>
    </fieldset>

    <fieldset class="link_panel" sec:authorize="hasAuthority('Admin')">
        <legend>Пользователи</legend>
        <div>
            <a href="setroles">Редактирование ролей</a>
        </div>
    </fieldset>

    <fieldset class="link_panel" sec:authorize="hasAuthority('Admin')">
        <legend>Администрирование</legend>
        <div>
            <a href="settings">Настройки приложения</a>
        </div>
    </fieldset>
</body>
</html>
