<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Словесный помогатор</title>
        <link rel="stylesheet" type="text/css" href="/css/common.css">
        <link rel="stylesheet" type="text/css" href="/css/collection.css">
        <link rel="stylesheet" type="text/css" href="/css/language.css">
        <link rel="icon" type="image/png" href="/img/globe.png" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
        <script src="/js/collection.js"></script>
        <script src="/js/language.js"></script>
        <script src="/js/sound.js"></script>
    </head>
    <body>
        <div class="user_pane">
            <div class="dropdown">
                <button id="dropdown_btn" th:text="${student_name}"></button>
                <div class="dropdown-content">
                    <!--            <a href="#">Мой профиль</a>-->
                    <a href="/logout">Выход</a>
                </div>
            </div>
<!--            <div>(Мой язык: <span th:text="${my_language}"></span>)</div>-->
        </div>
        <h1 class="caption">Словесный помогатор</h1>
        <div class="description_env">
            <div><button id="home_btn" onclick="location.href='/main'"></button></div>
            <div class="description">Подборка</div>
            <div></div>
        </div>

        <fieldset>
            <legend>Редактирование подборки</legend>
            <div class="lang_select">
                <label for="lang1">Язык</label>
                <div><button id="swap_button"></button></div>
                <label for="lang2">Язык</label>
                <input id="lang1" type="text" list="lang_list_1"/>
                <datalist id="lang_list_1"></datalist>
                <div></div>
                <input id="lang2" type="text" list="lang_list_2"/>
                <datalist id="lang_list_2"></datalist>
            </div>

            <div class="name_wrap">
                <div></div>
                <div>
                    <label for="collection_name">Подборка: </label><input id="collection_name" type="text" list="collections_list">
                    <datalist id="collections_list">
                    </datalist>
                </div>
                <div id="collection_sign"></div>
            </div>

            <div class="translation_wrap">
                <div>
                    <label for="translation_search">Поиск перевода: </label>
                    <input type="text" id="translation_search" list="words_list"/>
                    <datalist id="words_list"></datalist>
                </div>
                <div id="found_translation">
                    <span id="word1"></span>
                    <span class="hidden" id="delimiter"></span>
                    <span id="word2"></span>
                </div>
            </div>

            <div id="words_collection" tabindex="-1"></div>

            <div id="collection_message"></div>
        </fieldset>
        <div class="actions_wrap">
            <button onclick="location.href='/main'">Отмена</button>
            <button class="ok" id="ok_btn" disabled>OK</button>
        </div>
    </body>
</html>
